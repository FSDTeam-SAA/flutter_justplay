name: flutter_justplay
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # UI
  google_fonts: ^6.3.2
  cached_network_image: ^3.4.1
  flutx_core: ^1.1.1+1
  pin_code_fields: ^8.0.1
  flutter_svg: ^2.2.3

  # State Managemet
  get: 

  # Network
  dio: ^5.9.0
  hive_flutter: ^1.1.0
  crypto: ^3.0.6
  dartz: ^0.10.1
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^7.0.0
  image_picker: ^1.2.0
  file_picker: ^10.3.3
  equatable: ^2.0.7
  json_annotation: ^4.9.0
  socket_io_client: ^3.1.2
  cupertino_icons: ^1.0.8
  go_router: ^17.0.1
  intl: ^0.20.2
  get_storage: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:


  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Ligconsolata
      fonts:
        - asset: assets/fonts/Ligconsolata-Regular.ttf
        - asset: assets/fonts/Ligconsolata-Bold.ttf
          weight: 700

